[settings]
# Address and port of the C2 server
server_address = "127.0.0.1:8080"

# Encryption key for AES-256-GCM (must be exactly 32 bytes)
encryption_key = "a_very_secret_key_1234567890abcd"

# Directory for logging
log_directory = "/var/log/stalinium_client"

# Email settings for phishing operations
email_smtp_server = "smtp.example.com"
email_port = 587
email_username = "example@example.com"
email_password = "your_password"
